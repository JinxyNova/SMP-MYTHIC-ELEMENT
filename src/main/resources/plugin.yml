name: MythicSMP
version: '1.0.0'
main: com.merci.mythicsmp.MythicSMP
api-version: '1.20'
author: Merci

description: Plugin de SMP avec éléments, sorts, objets mythiques, économie, métiers, boss et quêtes.

commands:
  mythicelement:
    description: Choisir/consulter tes éléments (et sous-commandes admin).
    usage: /<command> [admin unlock|max <joueur> <élément|all>]
  mythicspells:
    description: Ouvrir la roue des sorts ou consulter le grimoire des sorts.
    usage: /<command> [liste [élément]]
  mythicadminspell:
    description: "[Admin] Débloquer/monter de niveau les sorts d'un joueur."
    usage: /<command> <unlock|setlevel|max|maxall|list> ...
    permission: mythicsmp.admin
  mythicultimate:
    description: Ouvrir le menu des sorts ultimes (Mage Ultime).
  mythicgive:
    description: "[Admin] Donner un objet mythique à un joueur."
    usage: /<command> <joueur> <itemId> [quantité]
    permission: mythicsmp.admin
  mythiclist:
    description: Lister tous les objets/armes mythiques du serveur.
    usage: /<command> [rareté]
  mythicboss:
    description: "[Admin] Faire apparaître un boss."
    permission: mythicsmp.admin
  mythicauction:
    description: Ouvrir l'hôtel des ventes.
  mythicsell:
    description: Mettre un objet en vente à l'hôtel des ventes.
  mythicbalance:
    description: Consulter ton solde.
  mythicjob:
    description: Choisir/consulter ton métier.
  mythicjobtop:
    description: Classement des métiers.
  mythicbaltop:
    description: Classement des soldes.
  mythicquests:
    description: Consulter tes quêtes en cours.

permissions:
  mythicsmp.admin:
    description: Accès aux commandes admin de MythicSMP (déblocage/niveau max/give).
    default: op
