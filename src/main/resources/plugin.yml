name: MythicSMP
version: '1.0.0'
main: com.merci.mythicsmp.MythicSMP
api-version: '1.21'
author: Merci
description: Armes et objets uniques et mythiques pour serveur SMP

commands:
  mythicgive:
    description: Donne un objet mythique à un joueur
    usage: /mythicgive <joueur> <id> [quantité]
    permission: mythicsmp.give
  mythiclist:
    description: Liste tous les objets mythiques disponibles, groupés par rareté
    usage: /mythiclist [rareté]
    permission: mythicsmp.list
  mythicboss:
    description: Invoque le Gardien Écarlate à ta position
    usage: /mythicboss
    permission: mythicsmp.boss
  mythicauction:
    description: Ouvre le marché entre joueurs
    usage: /mythicauction
    permission: mythicsmp.auction
  mythicsell:
    description: Met en vente l'objet tenu en main
    usage: /mythicsell <prix>
    permission: mythicsmp.auction
  mythicbalance:
    description: Affiche ton solde de pièces
    usage: /mythicbalance
    permission: mythicsmp.auction
  mythicquests:
    description: Affiche les quêtes du jour et ta progression
    usage: /mythicquests
    permission: mythicsmp.quests
  mythicjob:
    description: Choisis ou consulte ton métier
    usage: /mythicjob info | /mythicjob choose <métier>
    permission: mythicsmp.jobs
  mythicjobtop:
    description: Classement des métiers
    usage: /mythicjobtop
    permission: mythicsmp.jobs
  mythicelement:
    description: Consulte ou choisis ta classe élémentaire
    usage: /mythicelement [info] | /mythicelement choose | /mythicelement admin unlock|max <joueur> [élément|all]
    permission: mythicsmp.elements
  mythicspells:
    description: Ouvre la roue des sorts, consulte le grimoire, ou gère les sorts en admin
    usage: /mythicspells | /mythicspells liste [élément] | /mythicspells admin unlock|max <joueur> [sort|all]
    permission: mythicsmp.spells
  mythicbaltop:
    description: Classement des plus grosses fortunes
    usage: /mythicbaltop
    permission: mythicsmp.auction
  mythicultimate:
    description: Ouvre les sorts de la classe Ultime Mage
    usage: /mythicultimate
    permission: mythicsmp.ultimate
  mythicadminspell:
    description: Sort admin qui anéantit instantanément tout ce qui est proche
    usage: /mythicadminspell
    permission: mythicsmp.adminspell

permissions:
  mythicsmp.give:
    default: op
  mythicsmp.list:
    default: true
  mythicsmp.boss:
    default: op
  mythicsmp.auction:
    default: true
  mythicsmp.quests:
    default: true
  mythicsmp.jobs:
    default: true
  mythicsmp.elements:
    default: true
  mythicsmp.elements.admin:
    default: op
  mythicsmp.spells:
    default: true
  mythicsmp.spells.admin:
    default: op
  mythicsmp.ultimate:
    default: true
  mythicsmp.adminspell:
    default: op
